<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Home Office - Contratos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Estilos adicionales para feedback visual */
        #loading-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            z-index: 2000;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .main-container { display: none; } /* Se oculta hasta cargar datos */
    </style>
</head>
<body class="bg-light">

<div id="loading-overlay">
    <div class="spinner-border text-primary mb-2" role="status"></div>
    <div id="loading-text" class="fw-bold text-secondary">Conectando...</div>
</div>

<div class="container py-4 main-container" id="app-container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-1">Gerencia: CONTRATOS</h1>
            <p class="text-muted mb-0">Marcá presencialidad (máximo <span id="max-text" class="fw-bold">--</span> por día).</p>
        </div>

        <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalReset">
            Reset semana
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            
            <div class="d-flex justify-content-between mb-2">
                <div class="text-muted small">
                    <span class="badge bg-success">P</span> Presencial
                    <span class="badge bg-secondary ms-2">H</span> Home
                </div>
                <div id="status-msg" class="small fw-bold text-success" style="opacity:0; transition: opacity 0.5s;">Guardado</div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered align-middle text-center">
                    <thead class="table-light">
                        <tr id="table-head-row"></tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                    <tfoot class="table-secondary">
                        <tr id="table-foot-row"></tr>
                    </tfoot>
                </table>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="modalReset" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">¿Estás seguro?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Se borrarán <b>todas</b> las asistencias de la semana actual para todos los empleados.</p>
        <p class="mb-0 text-danger fw-bold">Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" onclick="confirmarReset()">Sí, Eliminar Todo</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ==========================================
    // CONFIGURACIÓN: Reemplaza con tu URL
    // ==========================================
    const API_URL = "https://manueln.pythonanywhere.com"; 

    // Referencias al DOM
    const loader = document.getElementById('loading-overlay');
    const loaderText = document.getElementById('loading-text');
    const appContainer = document.getElementById('app-container');
    const statusMsg = document.getElementById('status-msg');
    
    // Instancia del modal (para cerrarlo por JS)
    let modalResetInstancia;

    document.addEventListener("DOMContentLoaded", function() {
        // Inicializar el modal de Bootstrap
        const modalEl = document.getElementById('modalReset');
        modalResetInstancia = new bootstrap.Modal(modalEl);
        
        // Cargar datos iniciales
        cargarDatos(true);
    });

    // Función: Mostrar/Ocultar Loader
    function toggleLoader(show, text = "Cargando...") {
        loaderText.innerText = text;
        loader.style.display = show ? 'flex' : 'none';
        if (!show) appContainer.style.display = 'block';
    }

    // 1. CARGAR DATOS (GET)
    async function cargarDatos(esInicial = false) {
        if (esInicial) toggleLoader(true);

        try {
            const response = await fetch(`${API_URL}/api/datos?t=${Date.now()}`); // timestamp para evitar cache
            if (!response.ok) throw new Error("Error de conexión con el servidor");
            
            const data = await response.json();
            renderizarTabla(data);
        } catch (error) {
            console.error(error);
            alert("Error al cargar datos: " + error.message);
        } finally {
            if (esInicial) toggleLoader(false);
        }
    }

    // 2. RENDERIZAR TABLA
    function renderizarTabla(data) {
        const { dias, empleados, conteo, max_por_dia } = data;

        document.getElementById('max-text').textContent = max_por_dia;

        // Cabecera
        const headRow = document.getElementById('table-head-row');
        let headHTML = '<th class="text-start">Colaborador</th>';
        dias.forEach(d => headHTML += `<th>${d}</th>`);
        headRow.innerHTML = headHTML;

        // Cuerpo
        const body = document.getElementById('table-body');
        let bodyHTML = '';
        
        // Ordenar alfabéticamente
        const nombres = Object.keys(empleados).sort();

        nombres.forEach(nombre => {
            const diasAsignados = empleados[nombre];
            bodyHTML += `<tr><td class="text-start fw-semibold">${nombre}</td>`;
            
            dias.forEach(dia => {
                const presente = diasAsignados.includes(dia);
                const btnClass = presente ? 'btn-success' : 'btn-outline-secondary';
                
                bodyHTML += `
                    <td>
                        <button onclick="toggleEstado('${nombre}', '${dia}')" 
                                class="btn btn-sm ${btnClass}" 
                                style="width: 40px;">
                            ${presente ? 'P' : 'H'}
                        </button>
                    </td>`;
            });
            bodyHTML += `</tr>`;
        });
        body.innerHTML = bodyHTML;

        // Pie (Contadores)
        const footRow = document.getElementById('table-foot-row');
        let footHTML = '<th class="text-start">Total</th>';
        dias.forEach(d => {
            const total = conteo[d] || 0;
            const style = total > max_por_dia ? 'text-danger' : '';
            footHTML += `<th class="${style}">${total}</th>`;
        });
        footRow.innerHTML = footHTML;
    }

    // 3. CAMBIAR ESTADO (POST /toggle)
    async function toggleEstado(empleado, dia) {
        mostrarStatus("Guardando...", "text-warning");
        try {
            const response = await fetch(`${API_URL}/toggle`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ empleado, dia })
            });

            if (response.ok) {
                // Opción A: Recargar todo (más seguro)
                await cargarDatos(false);
                mostrarStatus("¡Guardado!", "text-success");
            } else {
                const err = await response.json();
                alert(err.error || "Error al guardar");
                mostrarStatus("Error", "text-danger");
            }
        } catch (e) {
            console.error(e);
            alert("Error de conexión");
        }
    }

    // 4. RESETEAR SEMANA (POST /reset)
    async function confirmarReset() {
        modalResetInstancia.hide(); // Cerrar modal visualmente
        toggleLoader(true, "Reseteando semana...");

        try {
            const response = await fetch(`${API_URL}/reset`, {
                method: 'POST'
            });
            
            if (response.ok) {
                await cargarDatos(false); // Recargar tabla limpia
                setTimeout(() => alert("Semana reseteada correctamente."), 200);
            } else {
                alert("Hubo un error al intentar resetear.");
            }
        } catch (e) {
            console.error(e);
            alert("Error de conexión al resetear.");
        } finally {
            toggleLoader(false);
        }
    }

    // Helper para feedback visual pequeño
    function mostrarStatus(texto, claseColor) {
        statusMsg.innerText = texto;
        statusMsg.className = "small fw-bold " + claseColor;
        statusMsg.style.opacity = 1;
        setTimeout(() => { statusMsg.style.opacity = 0; }, 2000);
    }

</script>

</body>
</html>
